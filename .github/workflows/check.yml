name: Check public build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate data and workspace isolation
        run: python -m unittest discover -s tests -v
      - name: Rebuild public artifacts
        run: python scripts/build.py
      - name: Check generated artifact consistency
        run: git diff --exit-code -- START.html index.html
      - name: Check release inventory
        run: python scripts/release_check.py
      - name: Check offline browser behavior
        run: node scripts/check_browser.mjs
