name: Check public build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate data and workspace isolation
        run: python -m unittest discover -s tests -v
      - name: Rebuild public artifacts
        run: python scripts/build.py
      - name: Check generated artifact consistency
        run: git diff --exit-code -- START.html index.html
      - name: Check release inventory
        run: python scripts/release_check.py
      - name: Check offline browser behavior
        run: node scripts/check_browser.mjs
